# Hardened node configuration (example hosts).
[Log]
Level = 'info'
JSONConsole = true

[WebServer]
AllowOrigins = 'https://node.example.com'
HTTPPort = 0

[WebServer.TLS]
CertPath = '/chainlink/tls/server.crt'
KeyPath = '/chainlink/tls/server.key'
HTTPSPort = 6689
ForceRedirect = true

[[EVM]]
ChainID = '1'

[[EVM.Nodes]]
Name = 'provider-a'
WSURL = 'wss://rpc-a.example.com/ws'
HTTPURL = 'https://rpc-a.example.com'

[[EVM.Nodes]]
Name = 'provider-b'
WSURL = 'wss://rpc-b.example.net/ws'
HTTPURL = 'https://rpc-b.example.net'
