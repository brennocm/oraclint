# Hardened Kubernetes manifests.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chainlink
spec:
  serviceName: chainlink
  selector:
    matchLabels: {app: chainlink}
  template:
    metadata:
      labels: {app: chainlink}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 14933
        runAsGroup: 14933
        fsGroup: 14933
      containers:
        - name: node
          image: smartcontract/chainlink:2.69.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CL_PASSWORD_KEYSTORE
              valueFrom:
                secretKeyRef: {name: chainlink-secrets, key: keystore-password}
          volumeMounts:
            - name: data
              mountPath: /home/chainlink
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: chainlink-ui
spec:
  type: ClusterIP
  selector: {app: chainlink}
  ports:
    - port: 6689
      targetPort: 6689
