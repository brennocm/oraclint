apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chainlink
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 14933
        runAsGroup: 14933
        fsGroup: 14933
      containers:
        - name: node
          image: smartcontract/chainlink:2.69.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
